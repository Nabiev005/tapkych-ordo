# Render Blueprint — «Тапкыч ордо» сервери (Socket.IO)
# Render: New → Blueprint → ушул репозиторийди тандаңыз.
#
# Маалымат туруктуу сакталышы үчүн Turso (акысыз) базасын туташтырыңыз:
# TURSO_DATABASE_URL жана TURSO_AUTH_TOKEN (README, 5.0-бөлүм).
# Булар коюлбаса — сервер кайра иштетилгенде база тазаланат.
services:
  - type: web
    name: tapkych-ordo
    runtime: node
    plan: free
    rootDir: server
    # Сайт (client) өзгөргөндө да кайра жайгаштыруу
    buildFilter:
      paths:
        - server/**
        - client/**
        - render.yaml
    # Сервер + сайт: сервер client/dist ичиндеги сайтты өзү берет (бүт система бир даректе)
    buildCommand: npm install && npm run build && cd ../client && npm install && npm run build
    # Базанын түзүлүшүн жаңыртуу → база бош болсо 25 мисал суроо → сервер
    startCommand: node dist/migrate.js && npx tsx prisma/seed.ts && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USER
        value: admin
      # Түзүүдө Render паролду сурайт
      - key: ADMIN_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Turso: libsql://….turso.io дареги жана токен
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # «Google менен кирүү» (милдеттүү эмес): OAuth Client ID жана админдин Gmail'дери (README, 6.1)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
